architecture: YOLO11
norm_type: sync_bn
use_ema: True
ema_decay: 0.9999
ema_decay_type: "exponential"
act: silu
find_unused_parameters: True

depth_mult: 1.0 # default: L version
width_mult: 1.0

YOLO11:
  backbone: YOLO11CSPDarkNet
  neck: YOLO11CSPPAN
  yolo_head: YOLOv8Head
  post_process: ~

YOLO11CSPDarkNet:
  arch: 'P5'
  return_idx: [2, 3, 4]
  last_stage_ch: 1024

# use default config
# YOLO11CSPPAN:

YOLOv8Head:
  fpn_strides: [8, 16, 32]
  loss_weight: {class: 0.5, iou: 7.5, dfl: 1.5}
  assigner:
    name: TaskAlignedAssigner
    topk: 10
    alpha: 0.5
    beta: 6.0
    eps: 0.000000001
    use_ciou: True
  nms:
    name: MultiClassNMS
    nms_top_k: 3000
    keep_top_k: 300
    score_threshold: 0.001
    nms_threshold: 0.7
  use_dwconv: True  # diff
